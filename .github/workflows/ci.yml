name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Must run BEFORE anything that could regenerate or replace the shipped freeze.
      - name: Verify the shipped freeze (config hash pin, fixture hashes, held-out boundaries)
        run: python verify_freeze.py

      - name: Full test suite (writes only to temporary directories)
        run: python -m pytest -q

      - name: Frozen held-out replay
        run: python run_heldout.py

      - name: Re-verify the freeze after the run
        run: python verify_freeze.py

      # Regeneration must reproduce every committed artifact. The chart PNG is excluded because image bytes
      # can differ across matplotlib/font builds; its inputs (metrics, alerts) are compared instead.
      - name: Published artifacts unchanged
        run: git diff --exit-code -- config data results ':(exclude)results/heldout/heldout_chart.png'
